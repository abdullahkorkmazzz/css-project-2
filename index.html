<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Google 1998</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="sayfa">

    <!-- logo -->
    <div class="logo">
      <img src="img/google1988logo.jpeg" alt="Google Beta">
    </div>

    <!-- arama alani -->
    <div class="arama-kutusu">
      <p>Search the web using Google!</p>
      <input type="text" class="arama-input">
      <div class="butonlar">
        <button type="button">Google Search</button>
        <button type="button">I'm feeling lucky</button>
      </div>
    </div>

    <!-- alt 3 kutu -->
    <div class="alt-alan">
      <div class="kutu sol">
        <p>Special Searches</p>
        <a href="#">Stanford Search</a><br>
        <a href="#">Linux Search</a>
      </div>

      <div class="kutu orta">
        <a href="#">Help!</a><br>
        <a href="#">About Google!</a><br>
        <a href="#">Company Info</a><br>
        <a href="#">Google! Logos</a>
      </div>

      <div class="kutu sag">
        <p>Get Google!</p>
        <p>updates monthly:</p>
        <input type="email" value="your e-mail" class="mail-input"><br>
        <button type="button">Subscribe</button>
        <a href="#">Archive</a>
      </div>
    </div>

    <p class="telif">Copyright &copy;1998 Google Inc.</p>

  </div>

</body>
</html>
